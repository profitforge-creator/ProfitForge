<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ProfitForge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    .container {
      padding: 20px;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      position: fixed;
      background: #111;
      padding: 20px;
    }

    .sidebar button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      background: #222;
      border: none;
      color: white;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #ff6600;
    }

    .main {
      margin-left: 240px;
      padding: 20px;
    }

    .card {
      background: #1a1a1a;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    .btn {
      padding: 10px 20px;
      background: #ff6600;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2>ProfitForge</h2>

    <button onclick="navigate('dashboard')">Dashboard</button>
    <button onclick="navigate('ideas')">Ideas</button>
    <button onclick="navigate('scripts')">Scripts</button>
    <button onclick="navigate('challenges')">Challenges</button>
    <button onclick="navigate('shop')">Shop</button>
  </div>

  <!-- Main Content -->
  <div class="main" id="app"></div>

  <script>
    function navigate(page) {
      const app = document.getElementById("app");

      if (page === "dashboard") {
        app.innerHTML = `
          <div class="card">
            <h1>Dashboard</h1>
            <p>Start building your income system.</p>
            <button class="btn" onclick="generateIdea()">Generate Idea</button>
          </div>
        `;
      }

      if (page === "ideas") {
        app.innerHTML = `
          <div class="card">
            <h1>Ideas</h1>
            <button class="btn" onclick="generateIdea()">Generate Idea</button>
            <p id="ideaOutput"></p>
          </div>
        `;
      }

      if (page === "scripts") {
        app.innerHTML = `
          <div class="card">
            <h1>Scripts</h1>
            <button class="btn" onclick="generateScript()">Create Script</button>
            <p id="scriptOutput"></p>
          </div>
        `;
      }

      if (page === "challenges") {
        app.innerHTML = `
          <div class="card">
            <h1>Money Challenges</h1>
            <button class="btn" onclick="completeChallenge()">Complete Challenge</button>
            <p id="challengeStatus"></p>
          </div>
        `;
      }

      if (page === "shop") {
        app.innerHTML = `
          <div class="card">
            <h1>Rewards Shop</h1>
            <p>Points: <span id="points">0</span></p>
            <button class="btn" onclick="buyItem()">Buy Feature (10 pts)</button>
          </div>
        `;
      }
    }

    function generateIdea() {
      const ideas = [
        "Post luxury lifestyle clips",
        "Make AI storytelling videos",
        "Sell a digital guide",
        "Start a niche TikTok page",
        "Create motivational edits"
      ];
      document.getElementById("ideaOutput").innerText =
        ideas[Math.floor(Math.random() * ideas.length)];
    }

    function generateScript() {
      document.getElementById("scriptOutput").innerText =
        "Hook → Problem → Solution → Call to action.";
    }

    let points = 0;

    function completeChallenge() {
      points += 10;
      document.getElementById("challengeStatus").innerText =
        "Challenge completed! +10 points";
    }

    function buyItem() {
      if (points >= 10) {
        points -= 10;
        alert("Item purchased!");
      } else {
        alert("Not enough points");
      }
      document.getElementById("points").innerText = points;
    }

    // Load default page
    navigate("dashboard");
  </script>

</body>
</html>
